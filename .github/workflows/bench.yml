name: bench

# Weekly performance-budget gate (PLAN.md §5.2): cargo xtask
# bench-check runs the criterion benches with short measurement
# windows and holds their medians against perf/budgets.toml.
on:
  schedule:
    - cron: "0 3 * * 1" # Mondays, 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  budgets:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      # The pinned toolchain (rust-toolchain.toml) is installed by the
      # rustup shim on first use; this step makes that explicit and logs
      # what CI actually ran on.
      - name: Log toolchain and image
        run: |
          rustup show
          rustc -Vv
          echo "Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"

      - name: cargo xtask bench-check
        run: cargo xtask bench-check
