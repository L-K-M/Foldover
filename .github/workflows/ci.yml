name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs: dispatch goes through the API, so it still works when
  # webhook delivery is throttled and pull_request events stop arriving.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The full local gate (fmt, clippy, tests, docs, layering, FFI drift;
  # whatever `xtask ci` aggregates), run once on Linux so it is cheap to
  # gate on.
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      # The pinned toolchain (rust-toolchain.toml) is installed by the
      # rustup shim on first use; this step makes that explicit and logs
      # what CI actually ran on.
      - name: Log toolchain and image
        run: |
          rustup show
          rustc -Vv
          echo "Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"

      - name: cargo xtask ci
        run: cargo xtask ci

      - name: Agent materialization policy template
        run: python3 scripts/test-materialization-policy.py --check-template

  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny@0.20.2

      - name: Log toolchain and image
        run: |
          rustup show
          rustc -Vv
          echo "Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"

      - name: cargo deny check
        run: cargo deny check

  # House style for the shell scripts; the runner image's shellcheck
  # version drifts, so the tool is pinned like cargo-deny.
  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: shellcheck@0.11.0

      - name: Log toolchain and image
        run: |
          shellcheck --version
          echo "Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"

      - name: shellcheck scripts/*.sh
        run: shellcheck scripts/*.sh

  # Links, anchors, fences and tables in every tracked Markdown file, plus
  # every Mermaid diagram (tools/doccheck).
  docs:
    name: Documentation checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Check links, anchors, fences and tables
        run: python3 tools/doccheck/checkdocs.py .

      - name: Parse every Mermaid diagram
        run: |
          npm --prefix tools/doccheck install --no-save mermaid@11 jsdom@25
          node tools/doccheck/mmdcheck.mjs .

  # Rust tests on the Apple silicon target, then the UniFFI
  # XCFramework, the XcodeGen project and an app `build test`. Ends by
  # uploading the zipped Release app for whoever pulls artifacts.
  macos:
    # The xcode-27 image runs macOS 27 on Apple silicon.
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Log toolchain and image
        run: |
          rustup show
          rustc -Vv
          xcodebuild -version
          echo "Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"

      - name: cargo test (aarch64-apple-darwin)
        run: cargo test --workspace --target aarch64-apple-darwin

      - name: Agent and CLI process smoke
        run: cargo xtask agent-smoke

      - name: Installed-code IPC authentication
        run: python3 scripts/test-installed-identity.py

      - name: Launchd materialization policy
        run: python3 scripts/test-materialization-policy.py

      # Builds the arm64 FoldoverCoreFFI.xcframework plus the Swift
      # bindings; the app links it below.
      - name: xtask ffi
        run: cargo xtask ffi

      # Drift check plus the strict Swift 6 type-check of the committed
      # bindings, which only runs on macOS.
      - name: xtask check-ffi
        run: cargo xtask check-ffi

      # XcodeGen writes the .xcodeproj (gitignored) the build and the
      # tests run from. Pinned and SHA-256-verified before unzipping.
      - name: Install XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" \
            | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" --version

      - name: Generate the Xcode project
        run: "$RUNNER_TEMP/xcodegen/bin/xcodegen generate --spec apple/project.yml"

      - name: xcodebuild build test
        run: |
          xcodebuild -project apple/Foldover.xcodeproj \
            -scheme Foldover \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/Foldover.xcresult" \
            CODE_SIGN_IDENTITY=- \
            build test

      - name: Upload the test result bundle on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Foldover-xcresult
          path: ${{ runner.temp }}/Foldover.xcresult

      # A Release app for whoever pulls the artifact: same signing,
      # zipped the way Finder would make it. The spec restricts both the
      # app and its XCFramework to Apple silicon.
      - name: Release build and zip the app
        run: |
          xcodebuild -project apple/Foldover.xcodeproj \
            -scheme Foldover \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -configuration Release \
            CODE_SIGN_IDENTITY=- \
            build
          app="$RUNNER_TEMP/DerivedData/Build/Products/Release/Foldover.app"
          test "$(lipo -archs "$app/Contents/MacOS/Foldover")" = arm64
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")" = 27.0
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -d --verbose=4 "$app" 2>&1 | grep -Fx 'Signature=adhoc'
          for executable in foldoverd foldover; do
            helper="$app/Contents/Library/LaunchServices/$executable"
            test "$(lipo -archs "$helper")" = arm64
            codesign --verify --strict "$helper"
            codesign -d --verbose=4 "$helper" 2>&1 | grep -E 'flags=.*runtime'
          done
          plutil -lint "$app/Contents/Library/LaunchAgents/ch.lkmc.foldover.agent.plist"
          python3 scripts/test-agent.py \
            "$app/Contents/Library/LaunchServices/foldoverd" \
            "$app/Contents/Library/LaunchServices/foldover"
          ditto -c -k --sequesterRsrc --keepParent \
            "$app" \
            "$RUNNER_TEMP/Foldover.zip"

      - name: Upload the app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Foldover-app
          path: ${{ runner.temp }}/Foldover.zip

  # Aggregate merge gate: always runs so the check exists even when a
  # needed job fails; succeeds only when every other job succeeded.
  ci:
    if: always()
    needs: [rust, deny, shellcheck, docs, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Log image
        run: |
          echo "Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
      - name: Aggregate results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          [ "$(echo "$NEEDS" | jq '[.[] | .result] | all(. == "success")')" = "true" ]
