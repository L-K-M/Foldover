name: devices

on:
  schedule:
    # After the nightly job, so the shared macOS runner is free.
    - cron: "47 4 * * *"
  workflow_dispatch:
  # TEMPORARY: verifies the job before it lands; removed before merge.
  push:
    branches: [quality/device-matrix]

permissions:
  contents: read

jobs:
  # Real file systems (PLAN.md §5.2 device matrix): the on-disk
  # simulation between an APFS folder and one on disk images of
  # case-sensitive APFS, HFS+, exFAT and FAT32.
  devices:
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      FOLDOVER_SIMULATION_CASES: "200"
      CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: "true"
      CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Log toolchain and image
        run: |
          rustup show
          rustc -Vv
          sw_vers
          echo "Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"

      - name: Simulate on each file system
        run: bash scripts/device-matrix.sh "$RUNNER_TEMP/devices"
