name: nightly

on:
  schedule:
    # Quiet hours for the shared runners.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Every parser of untrusted input (PLAN.md §5.2): the per-PR suite runs
  # the `fuzz_` property tests with proptest's default case count; this
  # runs them far longer. A failure prints the minimal input it found.
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      PROPTEST_CASES: "500000"
      # Release speed, but keep the checks a fuzz run is for.
      CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: "true"
      CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Log toolchain and image
        run: |
          rustup show
          rustc -Vv
          echo "Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"

      - name: Fuzz parsers
        run: cargo test --locked --release --workspace -- fuzz_

  # The engine against random edits and interrupted runs (PLAN.md §5.2),
  # far longer than the per-PR suite's handful of cases. A failure prints
  # the minimal sequence of edits and runs it found.
  simulate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      FOLDOVER_SIMULATION_CASES: "5000"
      CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: "true"
      CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Log toolchain and image
        run: |
          rustup show
          rustc -Vv
          echo "Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"

      - name: Simulate
        run: cargo test --locked --release -p foldover-engine -- simulation
