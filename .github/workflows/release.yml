name: release

# A version tag (vX.Y.Z, from scripts/release.sh --push) publishes the
# ad-hoc-signed app as a GitHub release (ADR 0045).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Reject tags that are not on main: a tag pushed to a feature branch
  # must not become a public download.
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Tag must be an ancestor of main
        run: |
          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Release tags must point to a commit on main"
            echo "Tag:  $(git rev-parse HEAD)"
            echo "Main: $(git rev-parse origin/main)"
            exit 1
          fi

  # Run the full CI qualification suite before anything can publish.
  # Inside a workflow_call run, github.workflow is the caller's workflow
  # name, so ci.yml pins a literal "ci-" prefix and cannot evaluate to this
  # workflow's group. Release runs are serialized by the group above.
  qualify:
    needs: [source]
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: [qualify]
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Release notes regressions
        run: python3 scripts/test-release-notes.py

      # The tag, the app's MARKETING_VERSION and the Cargo workspace must agree.
      - name: Check the version
        run: |
          version="${GITHUB_REF_NAME#v}"
          # On its own line so a failed read fails the step rather
          # than leave an empty pattern that matches every tag.
          shape="$(bash scripts/version-shape.sh)"
          [[ -n "$shape" && "$version" =~ $shape ]]
          # The release engine writes the version unquoted.
          grep -Ex "    MARKETING_VERSION: \"?${version//./\\.}\"?" apple/project.yml
          grep -Fx "version = \"$version\"" Cargo.toml
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build the XCFramework
        run: cargo xtask ffi

      - name: Install XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" \
            | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"

      - name: Generate the Xcode project
        run: "$RUNNER_TEMP/xcodegen/bin/xcodegen generate --spec apple/project.yml"

      - name: Build, verify and zip the app
        run: bash scripts/package-app.sh "$RUNNER_TEMP/Foldover-$VERSION.zip" "$RUNNER_TEMP/DerivedData"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release-notes.py "$VERSION" > "$RUNNER_TEMP/notes.md"
          flags=(--title "Foldover $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag)
          # A -suffix marks the tag a pre-release: `releases/latest` never
          # names one, so stable installs stay on the redirect check while
          # pre-release installs find them in the feed.
          [[ "$VERSION" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/Foldover-$VERSION.zip" "${flags[@]}"
