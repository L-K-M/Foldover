name: spike-s1

# The S1 spike (docs/adr/0001-uniffi-event-bridge.md): a throwaway
# UniFFI event-bridge benchmark, built and run on macOS. A measured
# result missing its target is data for the ADR, not a failure — the
# job fails only when the harness itself breaks.
on:
  workflow_dispatch:
    inputs:
      soak_seconds:
        description: Soak duration (0 runs only the original benchmark)
        type: choice
        options: ['0', '3600']
        default: '3600'
  pull_request:
    paths:
      - spikes/s1-uniffi-events/**
      - .github/workflows/spike-s1.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# A named bash shell adds -o pipefail, so `run.sh | tee` fails when the
# harness does instead of reporting tee's success.
defaults:
  run:
    shell: bash

jobs:
  bench:
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      # PRs exercise teardown and heap scanning without claiming the hour gate passed.
      S1_SOAK_SECONDS: ${{ inputs.soak_seconds || '10' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: shellcheck@0.11.0

      - name: Log toolchain and image
        run: |
          rustup show
          rustc -Vv
          xcodebuild -version
          swift --version
          shellcheck --version
          echo "Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"

      - name: shellcheck run.sh
        run: shellcheck spikes/s1-uniffi-events/run.sh

      # The bench prints the human summary; tee keeps it for the step
      # summary below. pipefail is on by default, so a harness break
      # still fails the step.
      - name: Run the spike
        run: |
          spikes/s1-uniffi-events/run.sh "$RUNNER_TEMP/s1-results.json" \
            | tee "$RUNNER_TEMP/s1-summary.txt"

      # Whatever exists by then still lands in the run summary, so a
      # harness break is diagnosable without pulling artifacts.
      - name: Append the results to the run summary
        if: always()
        run: |
          {
            echo "## spike-s1 results"
            echo
            cat "$RUNNER_TEMP/s1-summary.txt" 2>/dev/null || true
            echo
            echo '```json'
            cat "$RUNNER_TEMP/s1-results.json" 2>/dev/null \
              || echo "no results file (harness failed early)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the results JSON
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: s1-results
          path: ${{ runner.temp }}/s1-results.json
          if-no-files-found: warn
