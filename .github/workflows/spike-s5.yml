name: spike-s5

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'spikes/s5-diff-tree/**'
      - '.github/workflows/spike-s5.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The diff-tree benchmark (ADR docs/adr/0003-diff-tree-view.md):
  # builds the Release app and drives it through `open -W` the way
  # Sweetbriar's list benchmark does. run.sh fails only when the
  # harness itself breaks; a measured miss is data for the ADR.
  bench:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: shellcheck@0.11.0

      - name: Log toolchain and image
        run: |
          xcodebuild -version
          shellcheck --version
          echo "Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"

      - name: shellcheck run.sh
        run: shellcheck spikes/s5-diff-tree/run.sh

      - name: Check row formatting worker
        run: |
          swiftc -parse-as-library -swift-version 6 -warnings-as-errors \
            spikes/s5-diff-tree/DiffTreeBench/RowText.swift \
            spikes/s5-diff-tree/Tests/RowTextCheck.swift \
            -o "$RUNNER_TEMP/s5-row-text-check"
          "$RUNNER_TEMP/s5-row-text-check"

      # XcodeGen writes the .xcodeproj (gitignored) the build runs
      # from. Pinned and SHA-256-verified before unzipping, same as
      # the root macOS job.
      - name: Install XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" \
            | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" --version
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Run the benchmark
        timeout-minutes: 30
        run: spikes/s5-diff-tree/run.sh "$RUNNER_TEMP/s5-diff-tree.json"

      # A crashed app leaves no report; its crash log says why.
      - name: Print crash reports
        if: failure()
        run: |
          shopt -s nullglob
          for f in ~/Library/Logs/DiagnosticReports/DiffTreeBench*; do
            echo "== $f"
            head -c 20000 "$f"
          done

      - name: Append the report to the step summary
        if: always()
        run: |
          {
            echo '### spike-s5 diff tree'
            echo
            echo '```'
            cat spikes/s5-diff-tree/build/app.log 2>/dev/null || echo '(no app log)'
            echo '```'
            echo
            echo '```json'
            cat "$RUNNER_TEMP/s5-diff-tree.json" 2>/dev/null || echo '(no report)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: s5-diff-tree-report
          path: ${{ runner.temp }}/s5-diff-tree.json
          if-no-files-found: warn
