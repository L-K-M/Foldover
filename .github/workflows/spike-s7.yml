name: spike-s7

on:
  pull_request:
    paths:
      - spikes/s7-client-identity/**
      - .github/workflows/spike-s7.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  identity:
    runs-on: xcode-27
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log the measured environment
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Compile strict Swift 6 fixtures and measure authorization
        run: python3 spikes/s7-client-identity/run.py "$RUNNER_TEMP/s7-results.json"
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: s7-results
          path: ${{ runner.temp }}/s7-results.json
          if-no-files-found: error
