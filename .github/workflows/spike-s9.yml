name: spike-s9

on:
  workflow_dispatch:
  pull_request:
    paths:
      - spikes/s9-peer-pairing/**
      - .github/workflows/spike-s9.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Builds, tests and benches the S9 peer-pairing spike on Linux. The
  # job fails only when the harness itself breaks (build failure,
  # crashed bench); measured pass/fail lands in the results JSON, the
  # step summary and the ADR.
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Log toolchain and image
        run: |
          rustup show
          rustc -Vv
          echo "Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"

      # House style for the shell scripts; the runner image's
      # shellcheck drifts, so the tool is pinned like in ci.yml.
      - name: Install shellcheck
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: shellcheck@0.11.0

      - name: shellcheck run.sh
        run: shellcheck spikes/s9-peer-pairing/run.sh

      - name: Run the spike
        run: |
          set -o pipefail
          spikes/s9-peer-pairing/run.sh "$RUNNER_TEMP/s9-results.json" \
            | tee "$RUNNER_TEMP/s9-summary.txt"

      - name: Append summary and results to the step summary
        run: |
          {
            cat "$RUNNER_TEMP/s9-summary.txt"
            echo
            echo '```json'
            cat "$RUNNER_TEMP/s9-results.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the results JSON
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: s9-results
          path: ${{ runner.temp }}/s9-results.json
