[workspace]
resolver = "3"
members = [
    "crates/foldover-types",
    "crates/foldover-proto",
    "crates/foldover-fs",
    "crates/foldover-watch",
    "crates/foldover-net",
    "crates/foldover-db",
    "crates/foldover-os",
    "crates/foldover-endpoint",
    "crates/foldover-state",
    "crates/foldover-host",
    "crates/foldover-engine",
    "crates/foldover-service",
    "crates/foldover-ipc",
    "crates/foldoverd",
    "crates/foldover-client",
    "crates/foldover-ffi",
    "crates/foldover-cli",
    "crates/foldover-sim",
    "crates/foldover-bindgen",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Unlicense"
publish = false
rust-version = "1.99"

# Crates inherit this prohibition except audited macOS bindings in
# foldover-fs/foldover-os/foldover-watch and generated UniFFI in
# foldover-ffi.
# Their manifests document the narrower exceptions.
[workspace.lints.rust]
unsafe_code = "forbid"
