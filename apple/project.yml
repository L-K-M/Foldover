# The macOS app (PLAN.md §4.5): `xcodegen generate --spec
# apple/project.yml` produces `Foldover.xcodeproj` (ignored). Layout:
# the generated `FoldoverCore` Swift package (cargo xtask ffi), the
# `Foldover` SwiftUI app, and the app-hosted `FoldoverTests`
# Swift-Testing bundle.
# Adapted from L-K-M/Sweetbriar

name: Foldover

options:
  bundleIdPrefix: ch.lkmc.foldover
  deploymentTarget:
    macOS: "27.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ARCHS: arm64
  configs:
    # Both configurations ship only the supported Apple-silicon slice.
    Debug:
      ONLY_ACTIVE_ARCH: YES
    Release:
      ONLY_ACTIVE_ARCH: NO
      ENABLE_HARDENED_RUNTIME: YES
      # Ad-hoc signing otherwise injects get-task-allow, which private IPC refuses.
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

packages:
  FoldoverCore:
    path: FoldoverCore
  FoldoverSystem:
    path: FoldoverSystem

targets:
  Foldover:
    type: application
    platform: macOS
    sources:
      - Foldover
    dependencies:
      - package: FoldoverCore
        product: FoldoverCore
      - package: FoldoverSystem
        product: FoldoverSystem
    postBuildScripts:
      - name: Embed the background agent and CLI
        basedOnDependencyAnalysis: false
        script: bash "$SRCROOT/../scripts/embed-agent.sh" "$TARGET_BUILD_DIR/$WRAPPER_NAME"
    # Xcode writes the Info.plist from these settings, so no plist file
    # sits in the tree: an XcodeGen-written one would leave the tree
    # dirty after every generate, which the release engine rejects.
    # CFBundleShortVersionString and CFBundleVersion come from
    # MARKETING_VERSION and CURRENT_PROJECT_VERSION.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.lkmc.foldover
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Cargo resolves its own workspace inputs and writes to its target directory.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities

  FoldoverTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - FoldoverTests
    dependencies:
      - target: Foldover
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.lkmc.foldover.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Foldover.app/Contents/MacOS/Foldover
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  Foldover:
    build:
      targets:
        Foldover: all
        FoldoverTests:
          - test
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FoldoverTests
