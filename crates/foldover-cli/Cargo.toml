[package]
name = "foldover-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

# The binary is `foldover`; the package keeps the foldover-* name.
[[bin]]
name = "foldover"
path = "src/main.rs"

[dependencies]
foldover-client = { path = "../foldover-client" }
foldover-proto = { path = "../foldover-proto" }
serde_json = "1"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "sync", "time"] }
