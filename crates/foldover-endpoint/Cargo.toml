[package]
name = "foldover-endpoint"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
foldover-types = { path = "../foldover-types" }
foldover-proto = { path = "../foldover-proto" }
foldover-fs = { path = "../foldover-fs" }
foldover-watch = { path = "../foldover-watch" }
foldover-net = { path = "../foldover-net" }
foldover-os = { path = "../foldover-os" }
blake3 = "1.8.2"
ignore = "0.4.33"
serde_json = "1"
thiserror = "2"
tokio = { version = "1.53.2", features = ["rt", "sync", "time", "macros"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
rustix = { version = "1.1.5", features = ["fs"] }
tempfile = "3"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "time"] }
zeroize = "1.9.1"
