[package]
name = "foldover-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
blake3 = "1.8.2"
foldover-types = { path = "../foldover-types" }
foldover-endpoint = { path = "../foldover-endpoint" }
foldover-state = { path = "../foldover-state" }
foldover-host = { path = "../foldover-host" }
thiserror = "2"
unicode-normalization = "0.1.26"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
proptest = { version = "1", default-features = false, features = ["std"] }
