[package]
name = "foldover-fs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# Only audited macOS binding modules allow unsafe. Filesystem traversal
# explicitly forbids it; other crates inherit the workspace prohibition.
[lints.rust]
unsafe_code = "deny"

[dependencies]
cap-fs-ext = "4.0.3"
cap-std = "4.0.3"
foldover-types = { path = "../foldover-types" }
blake3 = "1.8.2"
libc = "0.2.190"
nix = { version = "0.31.3", features = ["fs"] }
rustix = { version = "1.1.5", features = ["fs"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[[bench]]
name = "hash"
harness = false

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
tempfile = "3"
