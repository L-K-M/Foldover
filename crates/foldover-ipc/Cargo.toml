[package]
name = "foldover-ipc"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
foldover-net = { path = "../foldover-net" }
foldover-proto = { path = "../foldover-proto" }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.53.2", features = ["rt", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
