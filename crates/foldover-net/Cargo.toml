[package]
name = "foldover-net"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
rustix = { version = "1", features = ["fs", "process"] }
