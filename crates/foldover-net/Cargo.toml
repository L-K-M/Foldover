[package]
name = "foldover-net"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
mdns-sd = { version = "=0.21.6", default-features = false }
quinn = { version = "=0.11.12", default-features = false, features = ["rustls-ring", "runtime-tokio"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["ring"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
rustix = { version = "1", features = ["event", "fs", "process"] }
sha2 = "=0.11.1"
thiserror = "2"
tokio = { version = "1.53.2", features = ["net", "io-util", "time"] }
zeroize = "1.9.1"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
nix = { version = "0.31.3", default-features = false, features = ["socket"] }
security-framework = "3.7.0"
tokio = { version = "1.53.2", features = ["macros", "process", "rt", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "test-util", "time"] }
turmoil = "=0.7.2"
