[package]
name = "foldover-net"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
rustix = { version = "1", features = ["fs", "process"] }
tokio = { version = "1.53.2", features = ["net", "io-util"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
nix = { version = "0.31.3", default-features = false, features = ["socket"] }
security-framework = "3.7.0"
tokio = { version = "1.53.2", features = ["macros", "process", "rt", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
