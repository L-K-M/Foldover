[package]
name = "foldover-service"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
foldover-engine = { path = "../foldover-engine" }
foldover-proto = { path = "../foldover-proto" }
foldover-types = { path = "../foldover-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.2", features = ["rt", "sync", "time"] }

[dev-dependencies]
blake3 = "1.8.2"
rustix = { version = "1.1.5", features = ["fs"] }
tokio = { version = "1.53.2", features = ["macros", "rt", "time"] }
tempfile = "3"
