[package]
name = "spike-s3-change-detection"
version = "0.0.0"
edition = "2024"
license = "Unlicense"
publish = false

# An empty workspace table keeps this spike out of the repository's root
# workspace; spikes are throwaway and versioned independently.
[workspace]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "=0.10.1"
